name: tour
description: "Tour - Aplicativo inteligente de recomendacao de locais"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_maps_flutter: ^2.6.1
  google_maps_flutter_web: ^0.5.10
  google_generative_ai: ^0.4.3
  geolocator: ^12.0.0
  geolocator_web: ^4.0.0
  dio: ^5.4.3
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.2
  url_launcher: ^6.3.0
  flutter_polyline_points: ^2.0.1
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
