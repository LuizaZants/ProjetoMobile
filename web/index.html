<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tour</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #4F46E5; }
    #loading { display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; color: white; font-family: sans-serif; gap: 14px; }
    .spin { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.3);
      border-top-color: white; border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWs2Uvi2MSBfCBA_uVJqYWJAjyqWtgDyk"></script>
</head>
<body>
  <div id="loading"><div class="spin"></div><p>Carregando Tour...</p></div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      var l = document.getElementById('loading');
      if (l) l.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
